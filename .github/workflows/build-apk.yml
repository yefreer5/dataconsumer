name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev wget

      - name: Install buildozer and cython
        run: pip install buildozer cython

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-

      - name: Set up Android SDK with cmdline-tools
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_ROOT"

          # Descargar cmdline-tools si no existen
          if [ ! -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Descargando Android SDK command-line tools..."
            wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdline-tools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unzip
            mv /tmp/cmdline-unzip/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm /tmp/cmdline-tools.zip
            echo "cmdline-tools instaladas"
          else
            echo "cmdline-tools ya existen"
          fi

          # Aceptar todas las licencias
          echo "Aceptando licencias..."
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true

          # Instalar build-tools y platform
          echo "Instalando build-tools y platform..."
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "platform-tools" > /dev/null 2>&1

          # Crear symlink para que buildozer encuentre sdkmanager en la ruta vieja
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$SDK_ROOT/tools/bin/avdmanager"

          echo "Android SDK listo"

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: '0'
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataConsumer-APK
          path: bin/*.apk
          retention-days: 30
