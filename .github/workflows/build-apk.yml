name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev lld

      - name: Install buildozer and cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython virtualenv

      - name: Build APK (full clean build)
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo ""
          echo "=== Building ==="
          buildozer android debug 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}
          echo ""
          echo "=== EXIT CODE: $RESULT ==="
          echo "=== APK search ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "no bin/"
          if [ $RESULT -ne 0 ]; then
            echo "=== LAST 80 LINES OF LOG ==="
            tail -80 build.log
            exit 1
          fi
        timeout-minutes: 45

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DataConsumer-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
