name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          set -o pipefail
          export BUILDOZER_WARN_ON_ROOT=0
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo ""
          echo "=== Starting build ==="
          yes | buildozer android debug 2>&1 | tee build.log
          echo "=== EXIT CODE: $? ==="
        timeout-minutes: 45

      - name: Find APK
        if: always()
        run: |
          echo "=== Searching for APK ==="
          find / -name "*.apk" -type f 2>/dev/null || true
          echo "=== bin/ ==="
          ls -laR bin/ 2>/dev/null || echo "no bin/"
          echo "=== Last 50 lines of log ==="
          tail -50 build.log 2>/dev/null || true

      - name: Collect APK
        if: always()
        run: |
          mkdir -p apk_output
          cp bin/*.apk apk_output/ 2>/dev/null || true
          find / -name "dataconsumer*.apk" -exec cp {} apk_output/ \; 2>/dev/null || true
          ls -la apk_output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DataConsumer-APK
          path: apk_output/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7
