name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev lld

      - name: Install buildozer and cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Build APK
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer android debug 2>&1 | tee build.log
          echo ""
          echo "=== SEARCHING FOR APK FILES ==="
          find . -name "*.apk" -type f 2>/dev/null
          find ~/.buildozer -name "*.apk" -type f 2>/dev/null || true
          echo ""
          echo "=== BIN DIRECTORY ==="
          ls -la bin/ 2>/dev/null || echo "bin/ does not exist"
          echo ""
          echo "=== BUILDOZER DIST OUTPUT ==="
          find .buildozer -path "*/build/outputs/apk/*" -type f 2>/dev/null || true
        timeout-minutes: 35

      - name: Collect APK from any location
        if: always()
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -type f -exec cp {} apk_output/ \; 2>/dev/null
          find ~/.buildozer -name "*.apk" -type f -exec cp {} apk_output/ \; 2>/dev/null || true
          echo "=== APKs found ==="
          ls -la apk_output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DataConsumer-APK
          path: apk_output/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7
